apiVersion: v1
kind: ConfigMap
metadata:
  name: trpc-service-config
data:
  TRPC_SERVICE_ENVIRONMENT: development
  TRPC_SERVICE_LOG_LEVEL: INFO
  TRPC_SERVICE_ALLOW_DEVELOPMENT_TOKEN: "true"
  TRPC_SERVICE_OIDC_ISSUER: ""
  TRPC_SERVICE_OIDC_AUDIENCE: ""
  TRPC_SERVICE_MODEL_ENDPOINT_HOSTS: "[]"
  TRPC_SERVICE_TENANT_SECRET_ENV_NAMES: '["TRPC_FEISHU_KIND_VERIFICATION_TOKEN","TRPC_FEISHU_KIND_ENCRYPT_KEY"]'
  TRPC_SERVICE_S3_ENDPOINT: ""
  TRPC_SERVICE_S3_BUCKET: trpc-kind-artifacts
  TRPC_SERVICE_OTLP_ENDPOINT: ""
  TRPC_SERVICE_CAPTURE_CONTENT: "false"
  TRPC_SERVICE_WORKER_CONCURRENCY: "2"
  TRPC_SERVICE_RECOVERY_POLL_SECONDS: "1"
  TRPC_SERVICE_REDIS_RECLAIM_AFTER_MS: "2000"
