apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      nodeSelector:
        trpc.io/node-role: agent-worker
        trpc.io/kind-pool: gateway
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: trpc-gateway
                  app.kubernetes.io/part-of: trpc-agent-service
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: trpc-gateway
              app.kubernetes.io/part-of: trpc-agent-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-admin
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-worker
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      nodeSelector:
        trpc.io/node-role: agent-worker
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: trpc-worker
                  app.kubernetes.io/part-of: trpc-agent-service
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: trpc-worker
              app.kubernetes.io/part-of: trpc-agent-service
---
