apiVersion: v1
kind: ConfigMap
metadata:
  name: kind-fake-provider-code
data:
  server.py: |
    """Deterministic provider used only by the local kind acceptance gate."""
    from __future__ import annotations

    import json
    import os
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path
    from urllib.parse import unquote, urlparse

    STATE = Path(os.environ.get("STATE_FILE", "/state/provider.json"))
    LOCK = threading.Lock()

    def load():
        try:
            return json.loads(STATE.read_text(encoding="utf-8"))
        except (FileNotFoundError, json.JSONDecodeError):
            return {"effects": {}, "calls": 0, "active": "baseline", "control_version": 1}

    def save(value):
        STATE.parent.mkdir(parents=True, exist_ok=True)
        temporary = STATE.with_suffix(".tmp")
        temporary.write_text(json.dumps(value, sort_keys=True), encoding="utf-8")
        temporary.replace(STATE)

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *_args):
            return

        def send_json(self, status, payload):
            body = json.dumps(payload, sort_keys=True).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def read_json(self):
            try:
                size = int(self.headers.get("Content-Length", "0"))
                return json.loads(self.rfile.read(size))
            except (ValueError, json.JSONDecodeError):
                return {}

        def do_GET(self):
            parsed = urlparse(self.path)
            if parsed.path == "/health":
                self.send_json(200, {"status": "ok"})
                return
            if parsed.path == "/v1/metrics":
                with LOCK:
                    state = load()
                    self.send_json(200, {
                        "provider_calls": state["calls"],
                        "effects": len(state["effects"]),
                        "active": state["active"],
                        "control_version": state["control_version"],
                    })
                return
            prefix = "/v1/effects/"
            if parsed.path.startswith(prefix):
                key = unquote(parsed.path[len(prefix):])
                with LOCK:
                    state = load()
                    effect = state["effects"].get(key)
                    self.send_json(200 if effect else 404, {
                        "effect_key": key,
                        "status": effect["status"] if effect else "not_found",
                        "provider_calls": state["calls"],
                    })
                return
            self.send_json(404, {"error": "not_found"})

        def do_POST(self):
            parsed = urlparse(self.path)
            payload = self.read_json()
            if parsed.path == "/v1/effects":
                key = str(payload.get("effect_key") or self.headers.get("Idempotency-Key") or "")
                if not key or len(key) > 256:
                    self.send_json(400, {"error": "effect_key_required"})
                    return
                with LOCK:
                    state = load()
                    effect = state["effects"].get(key)
                    if effect is None:
                        state["effects"][key] = {"status": "applied"}
                        state["calls"] += 1
                        save(state)
                    response = {
                        "effect_key": key,
                        "status": state["effects"][key]["status"],
                        "provider_calls": state["calls"],
                    }
                # Simulate a response lost after the provider accepted the
                # request.  The client must query, never retry the POST.
                if (
                    self.headers.get("X-Simulate-Timeout") == "true"
                    or payload.get("simulate_timeout") is True
                ):
                    self.send_json(504, {"error": "simulated_response_timeout"})
                else:
                    self.send_json(200, response)
                return
            if parsed.path == "/v1/promotions":
                expected = str(payload.get("expected_active") or "")
                candidate = str(payload.get("candidate") or "")
                if not expected or not candidate:
                    self.send_json(400, {"error": "promotion_fields_required"})
                    return
                with LOCK:
                    state = load()
                    if state["active"] != expected:
                        self.send_json(409, {
                            "error": "stale_active_pointer",
                            "active": state["active"],
                            "control_version": state["control_version"],
                        })
                        return
                    state["active"] = candidate
                    state["control_version"] += 1
                    save(state)
                    self.send_json(200, {
                        "active": candidate,
                        "control_version": state["control_version"],
                    })
                return
            self.send_json(404, {"error": "not_found"})

    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8080"))), Handler).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kind-fake-im-code
data:
  server.py: |
    """Idempotent IM callback sink for local multi-node tests."""
    from __future__ import annotations

    import json
    import os
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path

    STATE = Path(os.environ.get("STATE_FILE", "/state/im.json"))
    LOCK = threading.Lock()

    def load():
        try:
            return json.loads(STATE.read_text(encoding="utf-8"))
        except (FileNotFoundError, json.JSONDecodeError):
            return {"message_ids": [], "accepted": 0, "duplicates": 0}

    def save(value):
        STATE.parent.mkdir(parents=True, exist_ok=True)
        temporary = STATE.with_suffix(".tmp")
        temporary.write_text(json.dumps(value, sort_keys=True), encoding="utf-8")
        temporary.replace(STATE)

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *_args):
            return

        def send_json(self, status, payload):
            body = json.dumps(payload, sort_keys=True).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                self.send_json(200, {"status": "ok"})
                return
            if self.path == "/metrics":
                with LOCK:
                    state = load()
                    self.send_json(200, {
                        "accepted": state["accepted"],
                        "duplicates": state["duplicates"],
                        "unique_message_ids": len(state["message_ids"]),
                    })
                return
            self.send_json(404, {"error": "not_found"})

        def do_POST(self):
            if self.path != "/callback":
                self.send_json(404, {"error": "not_found"})
                return
            try:
                size = int(self.headers.get("Content-Length", "0"))
                body = json.loads(self.rfile.read(size))
            except (ValueError, json.JSONDecodeError):
                self.send_json(400, {"error": "invalid_json"})
                return
            message_id = str(body.get("message_id") or "")
            if not message_id or len(message_id) > 512:
                self.send_json(400, {"error": "message_id_required"})
                return
            with LOCK:
                state = load()
                if message_id in state["message_ids"]:
                    state["duplicates"] += 1
                    save(state)
                    self.send_json(200, {"accepted": False, "duplicate": True})
                    return
                state["message_ids"].append(message_id)
                state["accepted"] += 1
                save(state)
                self.send_json(202, {"accepted": True, "duplicate": False})

    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8080"))), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: kind-fake-provider
  labels:
    app.kubernetes.io/name: kind-fake-provider
    trpc.io/support: provider
spec:
  selector:
    app.kubernetes.io/name: kind-fake-provider
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kind-fake-provider
  labels:
    app.kubernetes.io/name: kind-fake-provider
    trpc.io/support: provider
spec:
  serviceName: kind-fake-provider
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kind-fake-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kind-fake-provider
        trpc.io/support: provider
    spec:
      nodeSelector:
        trpc.io/node-role: agent-worker
        trpc.io/kind-pool: support
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: trpc-gateway
                  app.kubernetes.io/part-of: trpc-agent-service
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 10
      volumes:
        - name: code
          configMap:
            name: kind-fake-provider-code
      containers:
        - name: provider
          image: python@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/server.py"]
          env:
            - name: PORT
              value: "8080"
            - name: STATE_FILE
              value: /state/provider.json
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: state
              mountPath: /state
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 128Mi
---
