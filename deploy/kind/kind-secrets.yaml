  TRPC_KIND_EVOLUTION_DATABASE_DSN: postgresql://trpc_evolution_authority:kind-evolution-password@postgres:5432/trpc_service

---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-redis-probe-secrets
type: Opaque
stringData:
  # Redis-only credentials for the disposable Redis probe.
  TRPC_SERVICE_REDIS_URL: redis://redis:6379/0
