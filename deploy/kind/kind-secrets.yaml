# Development-only values for the disposable kind cluster.  These values are
# not accepted by the production overlay and must never be copied to ACK.
apiVersion: v1
kind: Secret
metadata:
  name: trpc-service-secrets
type: Opaque
stringData:
  TRPC_SERVICE_DATABASE_DSN: postgresql://trpc_runtime:kind-runtime-password@postgres:5432/trpc_service
  TRPC_SERVICE_REDIS_URL: redis://redis:6379/0
  TRPC_SERVICE_SESSION_HMAC_KEY: kind-session-hmac-key-32-bytes-000000
  TRPC_SERVICE_EMERGENCY_QUEUE_KEY: kind-emergency-key-32-bytes-0000
  TRPC_SERVICE_DEVELOPMENT_TOKEN: kind-development-token
  TRPC_SERVICE_S3_ACCESS_KEY: kind-access
  TRPC_SERVICE_S3_SECRET_KEY: kind-secret
  # Disposable Feishu callback fixtures. Tenant bindings reference these
  # names through env://; they are never valid production credentials.
  TRPC_FEISHU_KIND_VERIFICATION_TOKEN: kind-feishu-verification-token
  TRPC_FEISHU_KIND_ENCRYPT_KEY: kind-feishu-encrypt-key
  TRPC_FEISHU_VERIFICATION_TOKEN_REF: env://TRPC_FEISHU_KIND_VERIFICATION_TOKEN
  TRPC_FEISHU_ENCRYPT_KEY_REF: env://TRPC_FEISHU_KIND_ENCRYPT_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-worker-secrets
type: Opaque
stringData:
  # Probe and settings require references for every Worker-family role.  The
  # plain DSN remains the value resolved by the env:// reference at runtime.
  TRPC_SERVICE_WORKER_DATABASE_DSN_REF: env://TRPC_SERVICE_WORKER_DATABASE_DSN
  TRPC_SERVICE_WORKER_DATABASE_DSN: postgresql://trpc_worker:kind-worker-password@postgres:5432/trpc_service
  TRPC_SERVICE_WORKER_DATABASE_PASSWORD_REF: env://TRPC_SERVICE_WORKER_DATABASE_PASSWORD
  TRPC_SERVICE_WORKER_DATABASE_PASSWORD: kind-worker-password
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-migration-secrets
type: Opaque
stringData:
  TRPC_SERVICE_DATABASE_DSN: postgresql://trpc_migration:kind-migration-password@postgres:5432/trpc_service
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-metrics-secrets
type: Opaque
stringData:
  TRPC_SERVICE_METRICS_DATABASE_DSN: postgresql://trpc_metrics:kind-metrics-password@postgres:5432/trpc_service
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-im-secrets
type: Opaque
stringData: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-tool-reconciler-secrets
type: Opaque
stringData:
  # Dedicated least-privilege authority for the tool reconciliation probe.
  TRPC_KIND_TOOL_RECONCILER_DSN: postgresql://trpc_tool_reconciler:kind-tool-reconciler-password@postgres:5432/trpc_service

---
