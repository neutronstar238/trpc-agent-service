map $arg_signature $trpc_has_signature {
    ""      0;
    default 1;
}

map $arg_msg_signature $trpc_has_msg_signature {
    ""      0;
    default 1;
}

map $arg_timestamp $trpc_has_timestamp {
    ""      0;
    default 1;
}

map $arg_nonce $trpc_has_nonce {
    ""      0;
    default 1;
}

map $arg_echostr $trpc_has_echostr {
    ""      0;
    default 1;
}

map $arg_encrypt_type $trpc_has_encrypt_type {
    ""      0;
    default 1;
}

log_format trpc_callback '$time_iso8601|$remote_addr|$request_method|$uri|'
                         '$status|$upstream_status|$request_time|$upstream_response_time|'
                         'signature=$trpc_has_signature|'
                         'msg_signature=$trpc_has_msg_signature|'
                         'timestamp=$trpc_has_timestamp|nonce=$trpc_has_nonce|'
                         'echostr=$trpc_has_echostr|encrypt_type=$trpc_has_encrypt_type';
