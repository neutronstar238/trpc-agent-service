server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tx.nstarzx.cn;

    ssl_certificate     /etc/letsencrypt/live/tx.nstarzx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tx.nstarzx.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/tx.nstarzx.cn;
        default_type text/plain;
        allow all;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:8740;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:8740;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location ^~ /v1/channels/feishu/ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8740;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 4s;
        proxy_read_timeout 4s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log /www/wwwlogs/tx.nstarzx.cn_callback.log trpc_callback;
    }

    location / {
        return 404;
    }

    access_log /www/wwwlogs/tx.nstarzx.cn_443.log;
    error_log  /www/wwwlogs/tx.nstarzx.cn_443.error.log;
}
