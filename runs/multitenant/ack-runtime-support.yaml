apiVersion: v1
kind: Namespace
metadata:
  name: trpc-runtime-support
  labels:
    app.kubernetes.io/managed-by: trpc-runtime-acceptance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: trpc-runtime-support
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trpc-runtime-postgres
  template:
    metadata:
      labels:
        app: trpc-runtime-postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: xuanyuan-pull
      nodeSelector:
        kubernetes.io/hostname: cn-shenzhen.10.151.161.179
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: elt91uy73y2gh25fs7.xuanyuan.run/pgvector/pgvector@sha256:a6579dded3ff4ed3d9565ae54ab253e2cb7ae24c5d1eb3bec8a89e73f038b68a
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runtime-support-secrets
                  key: postgres-admin-password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 3
            failureThreshold: 40
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
