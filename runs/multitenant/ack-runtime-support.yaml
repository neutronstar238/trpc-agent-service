apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap
  namespace: trpc-runtime-support
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: xuanyuan-pull
      nodeSelector:
        kubernetes.io/hostname: cn-shenzhen.10.151.161.179
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: elt91uy73y2gh25fs7.xuanyuan.run/pgvector/pgvector@sha256:a6579dded3ff4ed3d9565ae54ab253e2cb7ae24c5d1eb3bec8a89e73f038b68a
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: runtime-support-secrets
                  key: postgres-admin-password
            - name: RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runtime-support-secrets
                  key: runtime-password
            - name: WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runtime-support-secrets
                  key: worker-password
            - name: MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runtime-support-secrets
                  key: migration-password
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runtime-support-secrets
                  key: metrics-password
            - name: HPA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runtime-support-secrets
                  key: hpa-password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until pg_isready -h postgres -U postgres -d postgres; do sleep 2; done
              export TRPC_INIT_RUNTIME_PASSWORD="$RUNTIME_PASSWORD"
              export TRPC_INIT_WORKER_PASSWORD="$WORKER_PASSWORD"
              export TRPC_INIT_MIGRATION_PASSWORD="$MIGRATION_PASSWORD"
              export TRPC_INIT_METRICS_PASSWORD="$METRICS_PASSWORD"
              export TRPC_INIT_HPA_PASSWORD="$HPA_PASSWORD"
              unset RUNTIME_PASSWORD WORKER_PASSWORD MIGRATION_PASSWORD METRICS_PASSWORD HPA_PASSWORD
              psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d postgres <<'SQL'
              \getenv runtime_password TRPC_INIT_RUNTIME_PASSWORD
              \getenv worker_password TRPC_INIT_WORKER_PASSWORD
              \getenv migration_password TRPC_INIT_MIGRATION_PASSWORD
              \getenv metrics_password TRPC_INIT_METRICS_PASSWORD
              \getenv hpa_password TRPC_INIT_HPA_PASSWORD
              SELECT format('CREATE ROLE trpc_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD %L', :'runtime_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trpc_runtime') \gexec
              SELECT format('CREATE ROLE trpc_worker LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT BYPASSRLS PASSWORD %L', :'worker_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trpc_worker') \gexec
              SELECT format('CREATE ROLE trpc_migration LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD %L', :'migration_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trpc_migration') \gexec
              SELECT format('CREATE ROLE trpc_metrics LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD %L', :'metrics_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trpc_metrics') \gexec
              SELECT format('CREATE ROLE trpc_hpa LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD %L', :'hpa_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trpc_hpa') \gexec
              SELECT format('ALTER ROLE trpc_runtime PASSWORD %L', :'runtime_password') \gexec
              SELECT format('ALTER ROLE trpc_worker PASSWORD %L', :'worker_password') \gexec
              SELECT format('ALTER ROLE trpc_migration PASSWORD %L', :'migration_password') \gexec
              SELECT format('ALTER ROLE trpc_metrics PASSWORD %L', :'metrics_password') \gexec
              SELECT format('ALTER ROLE trpc_hpa PASSWORD %L', :'hpa_password') \gexec
              ALTER ROLE trpc_runtime NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
              ALTER ROLE trpc_worker NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT BYPASSRLS;
              ALTER ROLE trpc_migration NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
              ALTER ROLE trpc_metrics NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
              ALTER ROLE trpc_hpa NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
              SQL
              unset TRPC_INIT_RUNTIME_PASSWORD TRPC_INIT_WORKER_PASSWORD \
                TRPC_INIT_MIGRATION_PASSWORD TRPC_INIT_METRICS_PASSWORD TRPC_INIT_HPA_PASSWORD
              if ! psql -h postgres -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='trpc_service'" | grep -q 1; then
                createdb -h postgres -U postgres -O trpc_migration trpc_service
              fi
              psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d trpc_service <<'SQL'
              CREATE EXTENSION IF NOT EXISTS vector;
              GRANT CONNECT ON DATABASE trpc_service TO trpc_runtime, trpc_worker, trpc_migration, trpc_metrics, trpc_hpa;
              GRANT USAGE ON SCHEMA public TO trpc_runtime, trpc_worker;
              GRANT USAGE, CREATE ON SCHEMA public TO trpc_migration;
              SQL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: trpc-runtime-support
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: trpc-runtime-gate-backlog
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: ^trpc-runtime-gate-[0-9a-f]{10}$
            action: keep
          - source_labels: [__meta_kubernetes_service_name]
            regex: ^trpc-backlog-exporter$
            action: keep
          - source_labels: [__meta_kubernetes_service_label_trpc_io_managed_by]
            regex: ^trpc-kubernetes-runtime-gate$
            action: keep
          - source_labels: [__meta_kubernetes_service_label_trpc_io_run_nonce]
            regex: ^[0-9a-f]{32}$
            action: keep
          - source_labels: [__meta_kubernetes_service_label_trpc_io_cluster_fingerprint]
            regex: ^[0-9a-f]{63}$
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: ^metrics$
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_ready]
            regex: ^true$
            action: keep
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_trpc_io_run_nonce]
            regex: ^trpc-runtime-gate-[0-9a-f]{10};[0-9a-f]{32}$
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
            action: replace
          - source_labels: [__meta_kubernetes_service_label_trpc_io_run_nonce]
            target_label: run_nonce
            action: replace
          - source_labels: [__meta_kubernetes_service_label_trpc_io_cluster_fingerprint]
            target_label: cluster_fingerprint
            action: replace
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: ^trpc_session_ready_backlog$
            action: keep
---
